name: Recover canonical source trade writer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'feat/canonical-source-trade-write-architecture' || github.ref_name == 'feat/canonical-source-trade-write-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/canonical-source-trade-write-architecture

      - name: Diagnose exported patch transport
        shell: bash
        env:
          TARGET_BRANCH: feat/canonical-source-trade-write-architecture
        run: |
          set -euo pipefail
          if test -f .github/writer-export/diagnostic.txt; then
            cat .github/writer-export/diagnostic.txt
            exit 0
          fi

          cat .github/writer-export/part-00 \
              .github/writer-export/part-01 \
              .github/writer-export/part-02 > /tmp/commit.patch.b64

          set +e
          base64 --decode /tmp/commit.patch.b64 > /tmp/commit.patch
          decode_status=$?
          set -e

          {
            printf 'part00_bytes=%s\n' "$(wc -c < .github/writer-export/part-00)"
            printf 'part01_bytes=%s\n' "$(wc -c < .github/writer-export/part-01)"
            printf 'part02_bytes=%s\n' "$(wc -c < .github/writer-export/part-02)"
            printf 'combined_bytes=%s\n' "$(wc -c < /tmp/commit.patch.b64)"
            printf 'decode_status=%s\n' "$decode_status"
            printf 'decoded_bytes=%s\n' "$(wc -c < /tmp/commit.patch)"
            printf 'decoded_sha256=%s\n' "$(sha256sum /tmp/commit.patch | awk '{print $1}')"
            printf 'part00_head=%s\n' "$(head -c 24 .github/writer-export/part-00)"
            printf 'part00_tail=%s\n' "$(tail -c 24 .github/writer-export/part-00)"
            printf 'part01_head=%s\n' "$(head -c 24 .github/writer-export/part-01)"
            printf 'part01_tail=%s\n' "$(tail -c 24 .github/writer-export/part-01)"
            printf 'part02_head=%s\n' "$(head -c 24 .github/writer-export/part-02)"
            printf 'part02_tail=%s\n' "$(tail -c 24 .github/writer-export/part-02)"
          } > .github/writer-export/diagnostic.txt

          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add .github/writer-export/diagnostic.txt
          git commit -m "Record recovery transport diagnostics"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
