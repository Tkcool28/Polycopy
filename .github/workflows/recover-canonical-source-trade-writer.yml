name: Recover canonical source trade writer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'feat/canonical-source-trade-write-architecture' || github.ref_name == 'feat/canonical-source-trade-write-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/canonical-source-trade-write-architecture

      - name: Diagnose complete recovery blob
        shell: bash
        env:
          TARGET_BRANCH: feat/canonical-source-trade-write-architecture
        run: |
          set -euo pipefail
          rm -f .github/writer-export/full-diagnostic.txt
          set +e
          base64 --decode .github/writer-export/full.b64 > /tmp/commit.patch
          decode_status=$?
          set -e
          {
            printf 'encoded_bytes=%s\n' "$(wc -c < .github/writer-export/full.b64)"
            printf 'decode_status=%s\n' "$decode_status"
            printf 'decoded_bytes=%s\n' "$(wc -c < /tmp/commit.patch)"
            printf 'decoded_sha256=%s\n' "$(sha256sum /tmp/commit.patch | awk '{print $1}')"
            printf 'encoded_head=%s\n' "$(head -c 24 .github/writer-export/full.b64)"
            printf 'encoded_tail=%s\n' "$(tail -c 24 .github/writer-export/full.b64)"
          } > .github/writer-export/full-diagnostic.txt
          cat .github/writer-export/full-diagnostic.txt
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add .github/writer-export/full-diagnostic.txt
          git commit -m "Record complete recovery blob diagnostics"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
