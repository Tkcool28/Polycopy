name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

# [SAMPLE] CI uses only fixture/sample data — no secrets, no live API calls
# All tests run against in-memory or mocked data.
# No real Polymarket trades can be executed in CI.

permissions:
  contents: write

jobs:
  recover-canonical-writer:
    name: Reconstruct canonical writer branch
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/canonical-source-trade-write-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/canonical-source-trade-write-architecture

      - name: Apply exact verified export
        shell: bash
        env:
          BASE_SHA: 8ba2d3307143dcc5399854af65ad83b35f3fee93
          TARGET_BRANCH: feat/canonical-source-trade-write-architecture
        run: |
          set -euo pipefail
          old_sha="$(git rev-parse HEAD)"

          echo "38fc47b53c9be0a69ef1abdfdc03fa9eccde589c01a070a7ee2d4ca8fcc2c78a  .github/writer-export/commit.patch.gz" | sha256sum -c -
          gzip -dc .github/writer-export/commit.patch.gz > /tmp/commit.patch
          echo "548d4953eacf1af233e6c8ba320fe2ec37ce1c79b9925a27404c0dd69d15a5ca  /tmp/commit.patch" | sha256sum -c -

          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git reset --hard "$BASE_SHA"
          git apply --check /tmp/commit.patch
          git apply --index /tmp/commit.patch
          git diff --cached --check

          expected="$(cat <<'EOF' | sort
docs/canonical_source_trade_write_architecture.md
scripts/backfill_resolution_truth.py
scripts/backfill_specialist_trade_taxonomy.py
scripts/collect_approved_wallet_trades.py
scripts/collect_smart_money_data.py
scripts/collect_specialist_evidence_cohort.py
scripts/evidence_db.py
scripts/live_smoke_pr3_fixes.py
scripts/run_scan.py
scripts/seed_demo_data.py
src/polycopy/config/settings.py
src/polycopy/engine/source_trade_ingestion_writer_audit.py
src/polycopy/ingestion/source_trade_enrichment.py
src/polycopy/ingestion/source_trade_metadata_reconciliation.py
src/polycopy/ingestion/source_trade_resolution.py
tests/test_p24d_global_job_lock.py
tests/test_p24x_source_trade_ingestion_writer_audit.py
tests/test_pr24z_manual_real_source_trade_ingestion.py
tests/test_source_trade_write_architecture.py
EOF
          )"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          test "$(printf '%s\n' "$actual" | wc -l)" -eq 19

          git commit -m "Establish canonical source trade write architecture"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$old_sha"

  backend-lint-and-test:
    name: Python lint + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "ruff==0.16.0"

      - name: Ruff no-new-debt check
        id: ruff_delta
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_DIR: ${{ runner.temp }}/polycopy-ruff-base
          BASE_JSON: ${{ runner.temp }}/ruff-base.json
          HEAD_JSON: ${{ runner.temp }}/ruff-head.json
          DELTA_REPORT: ${{ runner.temp }}/ruff-delta.txt
        run: |
          set -euo pipefail
          ruff check src tests scripts/ci/check_ruff_delta.py \
            --output-format=json > "$HEAD_JSON" || true
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          (
            cd "$BASE_DIR"
            ruff check src tests --output-format=json > "$BASE_JSON" || true
          )
          python scripts/ci/check_ruff_delta.py \
            --base "$BASE_JSON" \
            --head "$HEAD_JSON" \
            --base-root "$BASE_DIR" \
            --head-root "$GITHUB_WORKSPACE" | tee "$DELTA_REPORT"

      - name: Upload Ruff delta report
        if: github.event_name == 'pull_request' && steps.ruff_delta.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-delta-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/ruff-delta.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Ruff no-new-debt result
        if: github.event_name == 'pull_request' && steps.ruff_delta.outcome == 'failure'
        run: exit 1

      - name: Ruff inventory on main
        if: github.event_name == 'push'
        run: ruff check src tests scripts/ci/check_ruff_delta.py --output-format=concise --exit-zero

      - name: Tests (pytest)
        run: pytest tests/ -q --tb=short

  frontend:
    name: Frontend lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build
